<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F.D.P. - Foi de Propósito?</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; color:#fff; padding:16px;
    display:flex; flex-direction:column; align-items:center;
    font-size: 16px; overflow-x: hidden;
  }
  h1 {
    font-size: 2rem; margin-bottom:4px; text-align:center;
    background: linear-gradient(90deg, #e94560, #f39c12);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 2px; font-weight: 900;
  }
  .subtitle { color:#aaa; margin-bottom:20px; font-style:italic; text-align:center; font-size:.9rem; }
  .screen { display:none; width:100%; max-width:900px; }
  .screen.active { display:block; }
  .box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; padding: 22px;
    backdrop-filter: blur(10px); margin-bottom: 16px;
  }
  .box h2 { margin-bottom:16px; color:#f39c12; font-size:1.2rem; }
  .box label { display:block; margin-bottom:6px; color:#ccc; font-size:.9rem; }
  .box input, .box select {
    width:100%; padding:14px; border-radius:10px;
    border:1px solid #444; background:#0f0f1e; color:#fff;
    font-size:1rem; margin-bottom:14px;
  }
  button {
    background: linear-gradient(90deg, #e94560, #c23152);
    color:#fff; border:none; padding:16px 24px;
    border-radius:12px; font-size:1rem; font-weight:bold;
    cursor:pointer; transition:.15s;
    text-transform: uppercase; letter-spacing:1px;
    width: 100%; margin-bottom: 10px;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity:.4; }
  button.secondary {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .game-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  .round-info {
    background: rgba(255,255,255,0.08);
    padding:8px 14px; border-radius:10px; font-size:.85rem;
  }
  .round-info strong { color:#f39c12; }
  .scores { display:flex; gap:6px; flex-wrap:wrap; }
  .score-chip {
    background: rgba(243,156,18,0.15);
    border:1px solid rgba(243,156,18,0.4);
    padding:5px 10px; border-radius:20px; font-size:.78rem;
  }
  .score-chip.judge {
    background: rgba(233,69,96,0.2); border-color: #e94560;
  }
  .score-chip.offline { opacity: .4; text-decoration: line-through; }
  .score-chip strong { color:#f39c12; }
  .black-card {
    background:#151515; border-radius:16px;
    padding:28px 20px; min-height:150px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:1.15rem; font-weight:700;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
    border: 2px solid #333; margin-bottom:16px; line-height:1.4;
  }
  .blank {
    display:inline-block; background:#fff; color:#000;
    border-radius:4px; padding:0 6px; margin:0 3px; min-width:70px;
  }
  .hand-title {
    color:#f39c12; margin-bottom:10px; font-size:.85rem;
    text-transform:uppercase; letter-spacing:1px; text-align:center;
  }
  .hand {
    display:grid; grid-template-columns: 1fr; gap:10px; margin-bottom:16px;
  }
  .white-card {
    background:#f5f5f5; color:#111;
    border-radius:12px; padding:16px 14px;
    min-height:70px; font-size:.92rem; font-weight:600;
    cursor:pointer; transition:.15s;
    border:3px solid transparent;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .white-card:active { transform: scale(.98); }
  .white-card.revealed {
    background:#fff; border-color:#2ecc71; cursor:default;
    animation: reveal .3s ease;
  }
  .white-card.winner {
    background:#d4edda; border-color:#2ecc71;
    animation: pulse 1s ease infinite;
  }
  @keyframes reveal { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(46,204,113,.7); }
    50% { box-shadow: 0 0 0 12px rgba(46,204,113,0); }
  }
  .status-msg {
    text-align:center; color:#f39c12; font-size:.95rem;
    margin-bottom:14px; min-height:22px; font-weight:600;
  }
  .waiting {
    text-align:center; padding:20px; color:#aaa;
    font-style: italic; font-size:.9rem;
  }
  .info {
    background: rgba(243,156,18,0.1);
    border: 1px solid rgba(243,156,18,0.3);
    border-radius:12px; padding:12px; margin-bottom:14px;
    font-size:.85rem; color:#f39c12; text-align:center;
  }
  .info code {
    background: rgba(0,0,0,.4); padding:3px 8px;
    border-radius:6px; font-size:1.1rem; letter-spacing:2px;
    color:#fff; font-weight:bold;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #e94560; color: #fff;
    padding: 12px 20px; border-radius: 10px;
    font-size: .9rem; z-index: 999; opacity: 0;
    transition: opacity .3s; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  @media (min-width: 700px) {
    .hand { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<h1>F.D.P.</h1>
<p class="subtitle">Foi de Propósito?</p>

<!-- ================= LOBBY ================= -->
<div id="lobbyScreen" class="screen active">
  <div class="box">
    <h2>👤 Seu nome</h2>
    <input type="text" id="playerName" placeholder="Digite seu nome" maxlength="15" autocomplete="off">
  </div>

  <div class="box">
    <h2>🏠 Criar uma sala</h2>
    <label for="targetScore">Pontos para vencer:</label>
    <select id="targetScore">
      <option value="3">3 pontos (rápido)</option>
      <option value="5" selected>5 pontos (normal)</option>
      <option value="7">7 pontos (longo)</option>
      <option value="10">10 pontos (maratona)</option>
    </select>
    <button onclick="createRoom()">Criar Sala</button>
  </div>

  <div class="box">
    <h2>🔗 Entrar em uma sala</h2>
    <input type="text" id="roomCodeInput" placeholder="Código da sala (ex: A3K9Z)" maxlength="5" autocomplete="off" style="text-transform: uppercase;">
    <button onclick="joinRoom()" class="secondary">Entrar</button>
  </div>
</div>

<!-- ================= LOBBY ESPERA ================= -->
<div id="waitingScreen" class="screen">
  <div class="box">
    <h2>⏳ Aguardando jogadores</h2>
    <div class="info">
      Compartilhe o código:<br><br>
      <code id="roomCodeDisplay">-----</code>
    </div>
    <p style="color:#ccc; margin-bottom:14px; font-size:.9rem;">Jogadores na sala:</p>
    <ul id="waitingPlayers" style="list-style:none; margin-bottom:14px;"></ul>
    <button id="startBtn" onclick="startGame()">Começar Partida</button>
    <p id="waitingHint" style="color:#aaa; font-size:.8rem; text-align:center; margin-top:8px;">Mínimo 3 jogadores</p>
  </div>
</div>

<!-- ================= JOGO ================= -->
<div id="gameScreen" class="screen">
  <div class="game-header">
    <div class="round-info">Rodada <strong id="roundNum">1</strong> • Juiz: <strong id="judgeName">-</strong></div>
    <div class="scores" id="scoresContainer"></div>
  </div>

  <div class="black-card" id="blackCard"></div>
  <div class="status-msg" id="statusMsg"></div>

  <div class="hand-title" id="handTitle"></div>
  <div class="hand" id="handContainer"></div>

  <div id="actionButtons"></div>
  <div class="waiting" id="waitingMsg" style="display:none;"></div>
</div>

<!-- ================= FIM ================= -->
<div id="winnerScreen" class="screen">
  <div class="box" style="text-align:center;">
    <h2 style="color:#f39c12; font-size:1.6rem;">🏆 Temos um Vencedor!</h2>
    <p id="winnerText" style="font-size:1.1rem; margin:20px 0;"></p>
    <p style="color:#aaa; font-size:.9rem; margin-bottom:20px;">Foi de propósito? Com certeza! 😈</p>
    <button onclick="restartGame()">Jogar de Novo</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// =============================================================
// ESTADO GLOBAL DO CLIENTE
// =============================================================
const client = {
  ws: null,
  myId: null,
  myName: '',
  roomCode: null,
  hand: [],
  state: null,
  isHost: false,
  selectedCardIndex: null
};

// =============================================================
// CONEXÃO WEBSOCKET
// =============================================================
function connect(onOpen) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  client.ws = new WebSocket(proto + '//' + location.host);
  client.ws.onopen = function() { if (onOpen) onOpen(); };
  client.ws.onmessage = function(ev) {
    try { handleMessage(JSON.parse(ev.data)); } catch(e) { console.error(e); }
  };
  client.ws.onclose = function() {
    showToast('Conexão perdida. Recarregue a página.');
  };
}

function send(msg) {
  if (client.ws && client.ws.readyState === 1) client.ws.send(JSON.stringify(msg));
}

// =============================================================
// AÇÕES DE LOBBY
// =============================================================
function createRoom() {
  const name = document.getElementById('playerName').value.trim();
  if (!name) return showToast('Digite seu nome');
  client.myName = name;
  const targetScore = parseInt(document.getElementById('targetScore').value);

  connect(function() {
    send({ type: 'CREATE_ROOM', name: name, targetScore: targetScore });
  });
}

function joinRoom() {
  const name = document.getElementById('playerName').value.trim();
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (!name) return showToast('Digite seu nome');
  if (!code) return showToast('Digite o código da sala');
  client.myName = name;

  connect(function() {
    send({ type: 'JOIN_ROOM', name: name, code: code });
  });
}

function startGame() {
  send({ type: 'START_GAME' });
}

function restartGame() {
  send({ type: 'RESTART' });
}

// =============================================================
// AÇÕES DE JOGO
// =============================================================
function playCard(index) {
  if (client.selectedCardIndex !== null) return;
  client.selectedCardIndex = index;
  send({ type: 'PLAY_CARD', cardIndex: index });
}

function judgePick(playerId) {
  send({ type: 'JUDGE_PICK', playerId: playerId });
}

function nextRound() {
  send({ type: 'NEXT_ROUND' });
}

// =============================================================
// HANDLE MENSAGENS DO SERVIDOR
// =============================================================
function handleMessage(msg) {
  switch (msg.type) {
    case 'ROOM_CREATED':
      client.roomCode = msg.code;
      client.isHost = true;
      showScreen('waitingScreen');
      document.getElementById('roomCodeDisplay').textContent = msg.code;
      break;

    case 'ROOM_JOINED':
      client.roomCode = msg.code;
      client.isHost = false;
      showScreen('waitingScreen');
      document.getElementById('roomCodeDisplay').textContent = msg.code;
      break;

    case 'HAND':
      client.hand = msg.hand;
      renderHand();
      break;

    case 'STATE':
      client.state = msg;
      const me = msg.players.find(function(p) { return p.name === client.myName; });
      if (me) client.myId = me.id;
      renderState();
      break;

    case 'ERROR':
      showToast(msg.msg);
      break;
  }
}
// =============================================================
// RENDERIZAÇÃO
// =============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function renderState() {
  const s = client.state;
  if (!s) return;

  if (s.phase === 'lobby') {
    showScreen('waitingScreen');
    renderWaiting();
    return;
  }

  if (s.phase === 'gameover') {
    showScreen('winnerScreen');
    const sorted = s.players.slice().sort(function(a,b) { return b.score - a.score; });
    const w = sorted[0];
    document.getElementById('winnerText').innerHTML =
      '<strong style="color:#e94560; font-size:1.4rem;">' + w.name + '</strong> venceu com ' + w.score + ' ponto(s)!';
    return;
  }

  showScreen('gameScreen');
  renderGame();
}

function renderWaiting() {
  const s = client.state;
  document.getElementById('roomCodeDisplay').textContent = s.code;
  const ul = document.getElementById('waitingPlayers');
  ul.innerHTML = '';
  s.players.forEach(function(p) {
    const li = document.createElement('li');
    li.style.cssText = 'padding:10px; background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px;';
    li.textContent = p.name + (p.connected ? '' : ' (offline)');
    ul.appendChild(li);
  });

  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('waitingHint');
  if (client.isHost) {
    startBtn.style.display = 'block';
    startBtn.disabled = s.players.length < 3;
    hint.textContent = s.players.length < 3 ? ('Faltam ' + (3 - s.players.length) + ' jogador(es)') : 'Pronto para começar!';
  } else {
    startBtn.style.display = 'none';
    hint.textContent = 'Aguardando o host começar...';
  }
}
